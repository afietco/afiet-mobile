# Mobil release otomasyonu: `mobile-vX.Y.Z` tag'i push'lanınca EAS'ta iOS
# production build alınır ve TestFlight'a gönderilir (iç test grubu
# "automatic distribution" ile build'i kendiliğinden dağıtır).
#
# Neden tag-tetiklemeli: her main push'unda build almak EAS kotasını boşa
# tüketir; release niyeti tag ile beyan edilir (/release skill'inin mobil
# bölümü tag'i atar). Gerekirse elle de tetiklenir (workflow_dispatch).
#
# Gereksinim: EXPO_TOKEN secret'ı (expo.dev → Account settings → Access
# tokens). ASC API anahtarı EAS sunucusunda kayıtlı; ascAppId eas.json'da.
name: mobile-release

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      submit:
        description: "Build sonrası TestFlight'a gönderilsin mi?"
        type: boolean
        default: true

jobs:
  ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: EAS CLI kurulumu
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: iOS production build (EAS)
        working-directory: apps/mobile
        # ÖNEMLİ: Bu CI Apple'a App Store Connect API Key ile bağlanır; eas-cli
        # yetkinlik (capability) senkronunu YALNIZCA cookie (Apple ID + şifre)
        # oturumunda yapar, API key oturumunda sessizce ATLAR. Bu yüzden yeni
        # bir yetkinlik (App Groups, Associated Domains, ...) eklerken önce
        # Apple Developer portalında co.afiet.app kimliğine elle eklenmeli;
        # aksi halde provisioning profile eksik kalır ve Xcode adımı düşer.
        run: eas build --platform ios --profile production --non-interactive --wait

      - name: TestFlight'a gönder
        if: ${{ github.event_name == 'push' || inputs.submit }}
        working-directory: apps/mobile
        run: eas submit --platform ios --latest --non-interactive

  # Android production releases use the same tag and version as iOS.
  # Signing credentials and the Play service account are stored by EAS.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Android production build (EAS)
        working-directory: apps/mobile
        run: eas build --platform android --profile production --non-interactive --wait

      # `eas submit` cannot create a Google Service Account key in
      # --non-interactive mode, which failed every release from 0.6.0 to
      # 0.7.1. The key now comes from a secret and is written to the path
      # eas.json's submit.production.android.serviceAccountKeyPath expects.
      # Never commit that file — .gitignore covers it.
      - name: Play service account key
        if: ${{ vars.PLAY_SUBMIT_ENABLED == 'true' && (github.event_name == 'push' || inputs.submit) }}
        working-directory: apps/mobile
        env:
          KEY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is empty but PLAY_SUBMIT_ENABLED is true"
            exit 1
          fi
          printf '%s' "$KEY_JSON" > play-service-account.json
          # Fail loudly here rather than letting eas submit report a vague error.
          python3 -c "import json;k=json.load(open('play-service-account.json'));assert k['type']=='service_account';print('service account key ok:',k['client_email'])"

      # Gated by PLAY_SUBMIT_ENABLED so that a red release run means something:
      # while Play was unconfigured, every release ended red regardless of
      # outcome, which masked a real npm ci failure in 0.7.1 that stopped the
      # iOS build entirely. The Android BUILD above always runs.
      - name: Submit to Play internal testing
        if: ${{ vars.PLAY_SUBMIT_ENABLED == 'true' && (github.event_name == 'push' || inputs.submit) }}
        working-directory: apps/mobile
        run: eas submit --platform android --profile production --latest --non-interactive --wait

      - name: Remove the service account key
        if: always()
        working-directory: apps/mobile
        run: rm -f play-service-account.json
