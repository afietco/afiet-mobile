# Continuous verification for pull requests and pushes targeting
# development, staging, or main. Unit tests, workspace type checks, and an
# Expo export must all pass.
#
# Release builds remain in the tag-triggered mobile-release.yml workflow.
name: ci

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run lint

      - run: npm run typecheck

      - name: Verify UI copy punctuation
        run: |
          if grep -R -n -F '—' packages/core/src apps/mobile/src apps/mobile/targets \
            --include='*.ts' --include='*.tsx' --include='*.swift'; then
            echo "Em dash characters are not allowed in user-facing source copy."
            exit 1
          fi

      - name: Verify mobile version consistency
        run: npm run verify:mobile-version

      - name: Verify generated permission configuration
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: 1
        run: |
          npx expo prebuild --clean --no-install
          if grep -R -E 'Allow .* to access your (camera|microphone|photos|speech)' ios; then
            echo "English permission copy found in the generated iOS project."
            exit 1
          fi
          # The microphone and the speech recognizer are both used (chat
          # dictation), and both have been silently dropped from the generated
          # project before: once by a config plugin that computed the string
          # and discarded it, once by expo-image-picker's `microphonePermission:
          # false`, which deletes the key outright. iOS terminates an app that
          # asks for either without a description, so their absence is a crash
          # rather than a missing dialog.
          for key in NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription; do
            if ! grep -R -F -q "<key>${key}</key>" ios; then
              echo "${key} is missing from the generated iOS project."
              exit 1
            fi
          done
          if grep -E 'android.permission.SYSTEM_ALERT_WINDOW' android/app/src/main/AndroidManifest.xml | grep -v 'tools:node="remove"'; then
            echo "Active blocked permission found in the generated Android project."
            exit 1
          fi

      - name: Expo export (bundle verification)
        run: npx expo export --platform ios --platform android
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://app-api-dev-f7cnieuuza-ew.a.run.app
          EXPO_PUBLIC_STACK_PROJECT_ID: df8401ea-a019-4316-9cbd-4192a5ab22a0
